{% set name = "numpy-stl" %}
{% set version = "4.1.0" %}
{% set sha256 = "dd4eccf3191dc68b4d8cb02ec7bc1623aaaac4deab3fe7612ea0ea7b0e721e4f" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - stl = stl.main:main
    - stl2ascii = stl.main:to_ascii
    - stl2bin = stl.main:to_binary

requirements:
  host:
    - pip
    - python {{ python_min }}
    - uv-build >=0.11,<0.12
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - python-utils >=3.4.5
    - typing_extensions >=4.1

test:
  imports:
    - stl
    - stl.mesh
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - stl --help
    - stl2ascii --help
    - stl2bin --help

about:
  home: https://github.com/WoLpH/numpy-stl
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Library to make reading, writing and modifying both binary and ascii STL files easy.
  description: |
    Simple library to make working with STL files (and 3D objects in general) fast and easy.

    Due to all operations heavily relying on numpy this is one of the fastest STL editing libraries for Python available.

  doc_url: https://numpy-stl.readthedocs.io
  dev_url: https://github.com/WoLpH/numpy-stl

extra:
  recipe-maintainers:
    - csachs
    - WoLpH
    - gouarin
